typeMismatch.giaoDichForm.dienTich=Diện tích phải là số

NotBlank.khachHangForm.tenKhachHang=Tên khách hàng không được để trống
Size.khachHangForm.tenKhachHang=Tên khách hàng không được vượt quá 100 ký tự

NotBlank.khachHangForm.soDienThoai=Số điện thoại không được để trống
SoDienThoaiHopLe.khachHangForm.soDienThoai=Số điện thoại phải gồm 10 chữ số và bắt đầu bằng 0 hoặc +84 (ví dụ: 0905973155)

KhongTrungSoDienThoai.khachHangForm.soDienThoai=Số điện thoại đã tồn tại

NotBlank.khachHangForm.email=Email không được để trống
Email.khachHangForm.email=Email không đúng định dạng
Size.khachHangForm.email=Email không được vượt quá 100 ký tự
KhongTrungEmail.khachHangForm.email=Email đã tồn tại
