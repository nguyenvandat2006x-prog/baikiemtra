NotBlank.giaoDichForm.maGiaoDich=Mã giao dịch không được để trống
MaGiaoDichHopLe.giaoDichForm.maGiaoDich=Mã giao dịch phải có dạng MGD-XXXX, trong đó XXXX là các chữ số (0-9)
Duplicate.giaoDichForm.maGiaoDich=Mã giao dịch đã tồn tại

NotNull.giaoDichForm.maKhachHang=Vui lòng chọn khách hàng
typeMismatch.giaoDichForm.maKhachHang=Khách hàng không hợp lệ

NotNull.giaoDichForm.loaiDichVu=Vui lòng chọn loại dịch vụ
typeMismatch.giaoDichForm.loaiDichVu=Loại dịch vụ không hợp lệ

NotNull.giaoDichForm.ngayGiaoDich=Ngày giao dịch không được để trống
Future.giaoDichForm.ngayGiaoDich=Ngày giao dịch phải lớn hơn thời gian hiện tại
typeMismatch.giaoDichForm.ngayGiaoDich=Ngày giao dịch phải có định dạng ngày/tháng/năm

NotNull.giaoDichForm.donGia=Đơn giá không được để trống
DecimalMin.giaoDichForm.donGia=Đơn giá phải lớn hơn 500.000 VND
typeMismatch.giaoDichForm.donGia=Đơn giá phải là số

NotNull.giaoDichForm.dienTich=Diện tích không được để trống
